# Spot 전용 Nav2 파라미터.
#
# ✅ 속도값은 **arena_s3 에서 odom 시뮬 시각 기준으로 재측정**했다 (2026-08-16).
#    실측 최고속 0.195 m/s, 최저 0.046 m/s. 자세한 표는 spot_driver.py 머리말.
#    ⚠️ 다시 잴 때도 벽시계가 아니라 시뮬 시각으로 재야 한다.
#
# nav2.yaml(UGV 기준)의 사본이며, **아래 표의 값만 다르다.** 그 밖의 항목은 nav2.yaml 이
# 원본이므로, 공통 설정을 고칠 때는 두 파일을 같이 봐야 한다.
#
# 왜 따로 필요한가 — Spot 은 cmd_vel 의 의미와 한계가 지상 차량과 다르다.
#
#   spot_driver.py:  StepLength = step_from_speed(linear.x[m/s]),  상한 MAX_STEP_LENGTH(0.090)
#                    YawRate    = YAW_PER_RADPS(8.11) * angular.z[rad/s], 상한 MAX_YAW_RATE(2.0)
#   -> 현재 케이던스 운용점(swing 0.12 / stepV 3.0)에서 0.195 m/s, 0.247 rad/s 가 최대.
#      보폭 하한(0.015) 때문에 약 0.046 m/s 아래도 못 낸다.
#
# ✅ 2026-08-16: spot_driver 가 cmd_vel 을 **실제 단위(m/s, rad/s)로 받도록 고쳤다.**
#    전진은 비선형(v = SPEED_COEF * L^0.81), 회전은 선형(YAW_PER_RADPS) — 그쪽 주석에 근거.
#    그래서 아래 상한은 이제 "로봇이 낼 수 있는 최대 실제 속도"를 그대로 적는다.
#
# 고치기 전의 실측값 — 이 표에서 환산 계수를 역산했다:
#
#   linear.x   0.100  0.200  0.333  0.500  1.000
#   실제 m/s   0.096  0.169  0.256  0.249  0.249    <- 0.333 부터 포화
#
#   angular.z  0.200  0.300  0.500  0.800
#   실제 rad/s 0.106  0.164  0.264  0.265           <- 0.500 부터 포화
#
# | 항목 | UGV | Spot | 근거 |
# |---|---|---|---|
# | footprint | 0.7 x 0.5 | 1.1 x 0.5 | 몸통 실측 그대로. **폭은 UGV와 같게 둔다** |
# | **컨트롤러** | DWB | **RPP** | 속도 샘플링 대신 경로 추종. 배회 2~5x -> 1~2x (실측). DWB 전용 항목(max_vel_x, acc_lim_x, sim_time, vx_samples)은 **사라졌다** |
# | `desired_linear_vel` | (max_vel_x 0.5) | **0.15** | 최고속은 0.195 지만 **회전을 얹으면 간헐적으로 넘어진다.** 아래 ⚠️ 참고 |
# | `rotate_to_heading_angular_vel` | (max_vel_theta 0.3) | **0.24** | 실측 제자리 회전 0.247 rad/s (여유 2 m 자리, 시뮬시각 기준) |
# | `regulated_linear_scaling_min_speed` | — | **0.05** | 보폭 하한에서 나오는 최저 속도(0.046 m/s) |
# | 리커버리 spin `max_rotational_vel` | 1.0 | **0.24** | 낼 수 없는 속도를 목표로 삼으면 리커버리가 시간 초과로 실패한다 |
# | inflation_radius | 0.6 | 0.85 | 스캔이 0.5 m 안쪽을 못 본다. 아래 ⚠️ 참고 |
# | cost_scaling_factor | 3.0 | 2.0 | 감쇠를 늦춰 0.5 m 지점의 비용을 119 -> 154 로 올린다 |
#
# ⚠️ footprint 폭을 함부로 키우지 말 것. NavFn 은 **내접 반경 안쪽을 통행 불가**로 본다.
#    폭을 0.5 -> 0.6 으로 늘렸더니 내접 반경이 0.25 -> 0.30 이 되어, 가구 사이 간격에서
#    "GridBased: failed to create plan" 으로 전역 경로가 아예 안 나왔다(실측).
#    Spot 의 다리는 주로 앞뒤로 스윙하므로 좌우로는 몸통보다 넓어지지 않는다.
#    길이(1.1 m)만 UGV보다 길게 잡는 것이 맞다.
#
# ✅ **자기 몸 끝의 장애물이 안 보이던 문제는 센서 쪽에서 고쳤다.**
#
#    예전에는 병합 스캔의 range_min 이 0.5 m 인데 footprint 반길이가 0.55 m 라
#    0.5 m 안쪽이 코스트맵에 아예 안 들어왔다 — 접촉 사고의 주원인이었다.
#    지금은 single_spot_launch.py 에서 **카메라별로** 하한을 준다(머리 0.20 /
#    옆구리 0.45 / 후방 0.70). 진행 방향은 0.20 m 까지 본다.
#
#    그때 인플레이션(0.85 / 2.0)은 그 사각을 **비용으로 메우려던 보정**이었다.
#
#      cost = 253 * exp(-scaling * (거리 - 내접반경 0.25))
#      0.5 m 에서:  3.0/0.6  -> 119     |  2.0/0.85 -> 154
#      0.7 m 에서:  3.0/0.6  ->  60     |  2.0/0.85 ->  95
#
#    사각이 없어졌으니 이제는 과보정일 수 있다. 대가는 **좁은 통로가 비싸지는 것**
#    이고, 실제로 NavFn 이 경로를 못 만든 적이 있다. 계획 실패나 과한 배회가 보이면
#    UGV 값(0.6 / 3.0)으로 되돌려 보는 것이 첫 번째 시도다. 아직 안 해 봤다.
#
# ⚠️ 보행 하한(보폭 0.015 = 현재 운용점에서 약 0.149 m/s)은 물리적 제약이라 없앨 수 없다.
#    없애면 발이 땅에서 안 떨어진다. 대신 **컨트롤러에게 알려서** 못 내는 속도를 계획하지
#    않게 했다 (RPP 의 regulated_linear_scaling_min_speed = 0.15. DWB 를 쓰던 시절에는
#    min_vel_x / min_speed_xy 였다). 알려주기 전에는 컨트롤러가 못 내는 저속 궤적을
#    골라 놓고 실제로는 더 빨리 나가서 목표를 지나쳤다.
#    대가: "아주 천천히 접근"이 불가능하다. xy_goal_tolerance 를 0.5 아래로 줄이지 말 것.
#
# ⚠️ 이 상한들은 spot_driver.py 의 SPEED_COEF / YAW_PER_RADPS / MAX_* / 케이던스와 한 쌍이다.
#    한쪽만 고치면 DWB 의 예측이 다시 어긋난다.

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 500
    # 🚨 BT 가 액션 서버의 응답을 기다리는 시간(ms). **기본값 20 ms 는 너무 짧다.**
    #
    # 이 프로젝트는 로봇 4대 + Webots 가 CPU 를 합계 950% 쓴다(실측). 그 부하에서
    # controller_server 가 20 ms 안에 응답을 못 하면 BT 가 이렇게 포기한다:
    #   "Timed out while waiting for action server to acknowledge goal request for follow_path"
    #   -> follow_path Aborting -> 리커버리 -> Goal failed
    # 경로 추종은 멀쩡한데(배회 1.0x) 목표가 죽는 원인이었다.
    server_timeout: 200
    default_server_timeout: 200
    transform_tolerance: 10.0
    # default_bt_xml_filename: "navigate_to_pose.xml"
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
    plugins:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0      # 🌟 [수정] Webots 부하를 줄이기 위해 10Hz로 감소
    min_x_velocity_threshold: 0.00
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.00
    transform_tolerance: 10.0        # 🌟 [수정/유지] TF 지연 1초 허용
    controller_plugins: ["FollowPath"]

    # 🚨 진전 검사기 — **느린 로봇에는 기본값(0.5 m / 10초)이 맞지 않는다.**
    #
    # SimpleProgressChecker 가 보는 것은 **이동량뿐이다.** 제자리 회전은 아무리 오래
    # 해도 진전 0 으로 친다. Spot 의 제자리 회전은 최대 0.247 rad/s 라 90도에 6.4초,
    # 회전 상한을 올리기 전(0.079 rad/s)에는 20초였다. 기본값 10초로는 회전 도중에
    # 목표가 통째로 죽었다.
    #
    # 실측 로그 — 30초 주기로 정확히 반복됐다:
    #   controller_server: Failed to make progress
    #   behavior_server:   Exceeded time allowance before reaching the Spin goal
    #
    # 60초면 최대 직진(0.195 m/s)으로 11.7 m, 회전만 해도 최소 100도는 돈다.
    #
    # ⚠️ 회전 상한을 올려 근본 원인은 줄였지만(0.079 -> 0.247 rad/s), 이 로봇은
    #    여전히 느리므로 여유는 넉넉히 둔다.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 60.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14
      stateful: True

    # 🌟 Regulated Pure Pursuit — DWB 를 대체한다.
    #
    # 왜 바꿨나: DWB 는 **속도 공간을 샘플링**해 궤적을 시뮬레이션하고 고른다.
    # 그래서 "명령한 속도로 실제로 움직인다"는 로봇 모델이 정확해야 하는데,
    # Spot 은 보행 로봇이라 그 가정이 약하다(보폭->속도 비선형, 최소 속도 존재,
    # 회전이 느림). 모델이 조금만 틀려도 매 주기 다른 궤적을 골라 배회한다 —
    # 실측에서 직선거리의 2~5 배를 걸었다.
    #
    # RPP 는 경로 위의 **전방 주시점(lookahead)** 을 따라가는 기하학적 추종이라
    # 속도 모델 오차에 훨씬 둔감하고, 느린 로봇에 잘 맞는다. 샘플링이 없어
    # vx_samples / sim_time 같은 항목이 통째로 사라지고 CPU 도 줄어든다
    # (군집 관점에서도 이득 — 로봇마다 붙는 비용이다).
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 🚨 **최고속(0.195)을 그대로 쓰면 안 된다.** 직진만 하면 견디지만 회전이
      # 얹히는 순간 여유가 0 이 되어 간헐적으로 넘어진다.
      #
      # 실측 — 회전 +-0.14 rad/s 를 4초마다 급반전시키며 최대 roll 을 봤다:
      #   0.19  ->  10.3도 / 45.3도 / 180도(뒤집힘)   같은 조건에서 통과와 넘어짐이 반반
      #   0.15  ->   5.2도                            ✅ 채택
      #   0.12  ->   6.0도                            더 낮춰도 나아지지 않는다
      #
      # ⚠️ 넘어짐은 **임계값이 아니라 확률**이다. 회전 상한(2.0)·회전 방향 급반전·
      #    특정 회전 속도는 전부 단독 원인이 아니었다(각각 따로 시험해 배제).
      #    남는 설명은 운용 속도가 한계에 붙어 있었다는 것이다.
      desired_linear_vel: 0.15
      # 전방 주시 거리. 짧으면 경로에 딱 붙지만 흔들리고, 길면 부드럽지만 모서리를 자른다.
      # Spot 은 몸이 1.1 m 라 그보다 조금 긴 값이 안정적이다.
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.2
      lookahead_time: 3.0
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 10.0
      # 회전이 느린 로봇이라(최대 0.247 rad/s) 굽은 구간에서 속도를 줄여야 따라간다.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.05   # 보폭 하한에서 나오는 최저 속도 0.046
      # 장애물 근처 감속. 스캔이 0.5 m 안쪽을 못 보는 것에 대한 추가 안전장치다.
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.0         # 코스트맵 값과 반드시 같아야 한다
      # 제자리 회전으로 경로 방향을 먼저 맞춘다.
      # ⚠️ 임계각을 작게 잡으면 안 된다. Spot 은 최대 0.26 rad/s 라 90도 도는 데만
      #    시뮬 6초가 걸린다. 0.6 rad(34도)으로 뒀더니 조금만 방향이 틀어져도 제자리
      #    회전에 들어가 목표 시간을 다 썼다. 1.0 rad(57도) 이상일 때만 제자리 회전하고,
      #    그보다 작으면 걸으면서 맞춘다.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.0
      # 실측 제자리 회전 0.247 rad/s (MAX_YAW_RATE 2.0 에서 포화). spot_driver.py 표 참고.
      # ⚠️ 이 값을 올리려면 드라이버의 MAX_YAW_RATE 부터 올려야 한다. 한 쌍이다.
      rotate_to_heading_angular_vel: 0.24
      max_angular_accel: 1.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true


controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.5
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 10.0       # 🌟 [추가] 코스트맵 TF 지연 1초 허용
      use_sim_time: True
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      footprint: "[[-0.55, -0.25], [-0.55, 0.25], [0.55, 0.25], [0.55, -0.25]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.85
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        pointcloud:
          topic: scan
          #min_obstacle_height: 0.1  # 🌟 [추가] 바닥(0.0)을 장애물로 인식하는 것을 방지
          #max_obstacle_height: 1.5  # 🌟 [수정] 천장을 장애물로 인식하지 않게 2.0 -> 1.5 정도로 낮춤
          clearing: True
          marking: True
          data_type: "LaserScan"
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 10.0       # 🌟 [추가] 코스트맵 TF 지연 1초 허용
      use_sim_time: True
      footprint: "[[-0.55, -0.25], [-0.55, 0.25], [0.55, 0.25], [0.55, -0.25]]"
      lethal_cost_threshold: 60
      resolution: 0.1
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        pointcloud:
          topic: scan
          #min_obstacle_height: 0.1  # 🌟 [추가] 바닥(0.0)을 장애물로 인식하는 것을 방지
          #max_obstacle_height: 1.5  # 🌟 [수정] 천장을 장애물로 인식하지 않게 2.0 -> 1.5 정도로 낮춤
          clearing: True
          marking: True
          data_type: "LaserScan"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.85
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0  # 🌟 [수정] 20.0 -> 10.0 Hz
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    # 🌟 리커버리(spin/backup)가 쓰는 프레임. 네임스페이스가 안 붙으면 리커버리가
    # 전부 Abort 되고, 그 여파로 목표까지 통째로 실패한다.
    #
    # ⚠️ 파라미터 이름은 `global_frame` 이다 (`local_frame` 이 아니다 — Humble 의
    #    nav2_behaviors 에는 그런 파라미터가 없어서 써 봐야 조용히 무시된다).
    #    다만 여기 값은 실제로 안 쓰인다. RewrittenYaml 의 `global_frame` 치환이
    #    이 값을 {ns}/map 으로 바꿔 버리기 때문에, nav2.launch.py 가 behavior_server
    #    노드에서 {ns}/odom 으로 다시 덮어쓴다. 근거는 그쪽 주석에 있다.
    global_frame: odom
    robot_base_frame: base_link
    # 🚨 회전 한계는 **노드 레벨**에 둬야 한다. `spin:` 아래에 중첩하면 조용히 무시되고
    #    Nav2 기본값(1.0)이 쓰인다 — behavior_server 의 global_frame 과 같은 부류의 함정이다.
    #    Spot 은 최대 0.263 rad/s 라 1.0 을 주면 낼 수 없는 속도를 목표로 삼고
    #    "Exceeded time allowance before reaching the Spin goal" 로 리커버리가 실패한다.
    max_rotational_vel: 0.24
    min_rotational_vel: 0.08
    rotational_acc_lim: 1.0
    plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      simulate_ahead_time: 2.0
      transform_timeout: 1.0          # 🌟 [수정] 회전 시 TF 타임아웃 1초로 연장
    backup:
      plugin: "nav2_behaviors/BackUp"
      transform_timeout: 1.0          # 🌟 [수정] 후진 시 TF 타임아웃 1초로 연장
    wait:
      plugin: "nav2_behaviors/Wait"

robot_state_publisher:
  ros__parameters:
    use_sim_time: True