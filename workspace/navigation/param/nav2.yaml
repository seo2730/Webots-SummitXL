bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 500
    transform_tolerance: 10.0
    # default_bt_xml_filename: "navigate_to_pose.xml"
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
    plugins:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0      # 🌟 [수정] Webots 부하를 줄이기 위해 10Hz로 감소
    min_x_velocity_threshold: 0.00
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.00
    transform_tolerance: 10.0        # 🌟 [수정/유지] TF 지연 1초 허용
    controller_plugins: ["FollowPath"]

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14
      stateful: True

    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.3
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.5
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: -0.5
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 10.0
      trans_stopped_velocity: 0.0
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 62.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.5
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 10.0       # 🌟 [추가] 코스트맵 TF 지연 1초 허용
      use_sim_time: True
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      footprint: "[[-0.35, -0.25], [-0.35, 0.25], [0.35, 0.25], [0.35, -0.25]]"
      # 🚨 static layer 를 지역 코스트맵에도 넣는다. DWB 는 **지역** 코스트맵으로 충돌을
      #    검사하는데, 이게 비어 있으면 로봇이 벽을 못 본 채 달린다. 실측(arena_s3, 융합 시행):
      #    UGV 가 문틀에 끼여 자기 칸 비용 99(전역)인데 지역 코스트맵은 100% 0 이었고,
      #    출발점이 충돌이라 플래너가 401회 실패하며 한 시간 넘게 멈춰 있었다.
      #    🚨 장애물 층은 **빼 둔다.** 소스 블록 이름을 고쳐 이 층을 살렸더니 코스트맵 갱신
      #       스레드가 막혀 **롤링 창이 그 자리에 얼어붙었다**(실측: 25초 동안 원점 불변,
      #       로봇이 창 밖으로 나가 DWB 가 "유효 궤적 0/419"). 같은 시각 드론(장애물 층 없음)
      #       창은 정상적으로 따라 움직였다. 정적 벽은 static layer 로 충분하다.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 🚨 0.6 -> 0.35 로 줄였다 (2026-10-23). 0.6 이면 폭 1.2 m 복도의 **중앙선만**
        #    남아, 로봇이 조금만 벗어나도 DWB 가 "유효 궤적 0/419" 를 내고 복구 회전마저
        #    "Collision Ahead" 로 실패한다. 실측(시드 실험 A): UGV 가 72라운드 동안
        #    11.7 m 만 움직이고 포기 23회. 같은 시행에서 드론은 490 m 를 돌았다.
        #    이 월드의 복도는 1.2~1.5 m 가 흔하므로 0.35 가 맞다 (내접 반경 0.25 + 여유).
        #
        #    ⚠️ 이것만으로 다 풀리지는 않는다. 위 주석의 "자기 칸 비용 99" 사례처럼
        #       SLAM 자세가 정적 지도의 벽 안으로 들어가면 출발점이 충돌이라 어떤 팽창
        #       값에서도 궤적이 안 나온다. 그건 지도 품질 문제다 (score_map_quality.py).
        cost_scaling_factor: 2.5
        inflation_radius: 0.35
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        # ⚠️ 블록 이름이 소스 이름(scan)과 달라 이 설정은 실제로 붙지 않는다. 고쳐서 층을
        #    살렸더니 코스트맵 갱신이 막혔다(위 주석). 정적 벽은 static layer 가 담당한다.
        pointcloud:
          topic: scan
          #min_obstacle_height: 0.1  # 🌟 [추가] 바닥(0.0)을 장애물로 인식하는 것을 방지
          #max_obstacle_height: 1.5  # 🌟 [수정] 천장을 장애물로 인식하지 않게 2.0 -> 1.5 정도로 낮춤
          clearing: True
          marking: True
          data_type: "LaserScan"
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 10.0       # 🌟 [추가] 코스트맵 TF 지연 1초 허용
      use_sim_time: True
      footprint: "[[-0.35, -0.25], [-0.35, 0.25], [0.35, 0.25], [0.35, -0.25]]"
      lethal_cost_threshold: 60
      resolution: 0.1
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        # ⚠️ 블록 이름이 소스 이름(scan)과 달라 이 설정은 실제로 붙지 않는다. 고쳐서 층을
        #    살렸더니 코스트맵 갱신이 막혔다(위 주석). 정적 벽은 static layer 가 담당한다.
        pointcloud:
          topic: scan
          #min_obstacle_height: 0.1  # 🌟 [추가] 바닥(0.0)을 장애물로 인식하는 것을 방지
          #max_obstacle_height: 1.5  # 🌟 [수정] 천장을 장애물로 인식하지 않게 2.0 -> 1.5 정도로 낮춤
          clearing: True
          marking: True
          data_type: "LaserScan"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.35   # 지역과 같은 값 — 전역만 보수적이면 경로가 아예 안 나온다
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0  # 🌟 [수정] 20.0 -> 10.0 Hz
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    # 🌟 리커버리(spin/backup)가 쓰는 프레임. 네임스페이스가 안 붙으면 리커버리가
    # 전부 Abort 되고, 그 여파로 목표까지 통째로 실패한다.
    #
    # ⚠️ 파라미터 이름은 `global_frame` 이다 (`local_frame` 이 아니다 — Humble 의
    #    nav2_behaviors 에는 그런 파라미터가 없어서 써 봐야 조용히 무시된다).
    #    다만 여기 값은 실제로 안 쓰인다. RewrittenYaml 의 `global_frame` 치환이
    #    이 값을 {ns}/map 으로 바꿔 버리기 때문에, nav2.launch.py 가 behavior_server
    #    노드에서 {ns}/odom 으로 다시 덮어쓴다. 근거는 그쪽 주석에 있다.
    global_frame: odom
    robot_base_frame: base_link
    plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 3.2
      transform_timeout: 1.0          # 🌟 [수정] 회전 시 TF 타임아웃 1초로 연장
    backup:
      plugin: "nav2_behaviors/BackUp"
      transform_timeout: 1.0          # 🌟 [수정] 후진 시 TF 타임아웃 1초로 연장
    wait:
      plugin: "nav2_behaviors/Wait"

robot_state_publisher:
  ros__parameters:
    use_sim_time: True